# SPDX-License-Identifier: MIT
events { worker_connections 2048; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=10r/m;
  upstream api { server api:8000; }
  upstream web { server web:3000; }
  server { listen 80; server_name _; return 308 https://$host$request_uri; }
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /api/v1/metrics { return 404; }
    location = /api/v1/ready { return 404; }
    location = /api/v1/readiness { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location ~ ^/api/v1/auth/(login|register)$ {
      limit_req zone=auth_rate burst=15 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/proxy_params_studio;
    }
    location /api/ {
      proxy_pass http://api;
      include /etc/nginx/proxy_params_studio;
      proxy_request_buffering off;
      proxy_read_timeout 180s;
    }
    location / { proxy_pass http://web; include /etc/nginx/proxy_params_studio; }
  }
}
