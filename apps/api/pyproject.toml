[project]
name = "ctf-writeup-studio-api"
version = "0.1.0"
license = {text = "MIT"}
authors = [{name = "CTF Writeup Studio contributors"}]
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
 "pydantic-settings>=2.4", "pwdlib[argon2]>=0.2", "python-multipart>=0.0.9",
 "psycopg[binary]>=3.2", "alembic>=1.13", "bleach>=6.1", "markdown-it-py>=3.0",
 "httpx>=0.27", "boto3>=1.35", "python-magic>=0.4.27", "email-validator>=2.2",
 "pillow>=11.0", "redis>=5.2", "rq>=2.1", "prometheus-client>=0.21",
 "reportlab>=4.2", "pygments>=2.18", "markdown-it-py[plugins]>=3.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.9", "pyright>=1.1", "moto[s3]>=5.0", "pip-audit>=2.7"]
[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
where=["."]
include=["app*"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
addopts="-ra"
markers=["postgres: requires TEST_DATABASE_URL PostgreSQL instance", "integration: infrastructure integration"]
[tool.coverage.run]
source=["app"]
omit=["app/main.py"]
[tool.ruff]
target-version="py311"
line-length=120
[tool.ruff.lint]
select=["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py"=["F401"]
[tool.pyright]
pythonVersion="3.11"
typeCheckingMode="basic"
include=["app"]
exclude=["alembic", "tests"]
