name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ctf_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ctf_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and development tools
        working-directory: apps/api
        run: python -m pip install --upgrade pip uv && uv pip install --system --require-hashes -r requirements.lock && pip install --no-deps -e . && pip install pyright pip-audit
      - name: Validate Python
        working-directory: apps/api
        run: |
          python -m compileall app
          ruff check app --ignore E702,F401
      - name: Typecheck critical security modules
        working-directory: apps/api
        run: |
          # Scope expands per module as typing debt is cleared (see docs/AUDIT-DEEP-2026-10-29.md A5)
          pyright app/security.py app/modules/identity/services.py app/modules/identity/routes.py app/modules/evidence/validation.py
      - name: Audit Python dependencies
        working-directory: apps/api
        run: pip-audit -r requirements.lock --progress-spinner off
      - name: Apply migrations
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ctf_test
        run: alembic upgrade head
      - name: Test API
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ctf_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ctf_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Verify OpenAPI is current
        working-directory: apps/api
        env:
          ENVIRONMENT: development
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
        run: |
          python ../../scripts/export_openapi.py
          git diff --exit-code ../../docs/api/openapi.json || \
            (echo "OpenAPI divergiu da API real; execute scripts/export_openapi.py e faça commit" && exit 1)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        working-directory: apps/web
        run: npm ci
      - name: Audit Node dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Validate frontend
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build

  backup:
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ctf_backup
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ctf_backup"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install backup tools
        working-directory: apps/api
        run: pip install -e '.[dev]'
      - name: Run backup unit and integrity checks
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/ctf_backup
        run: pytest ../../tests/infra/test_backups.py -q
        working-directory: apps/api

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ctf_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ctf_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API
        working-directory: apps/api
        run: python -m pip install --upgrade pip uv && uv pip install --system --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Install frontend
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps
      - name: Apply migrations
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ctf_e2e
        run: alembic upgrade head
      - name: Start API
        working-directory: apps/api
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ctf_e2e
          SECRET_KEY: e2e-test-secret-key-for-ci-use-only-32ch
          CORS_ORIGINS: http://127.0.0.1:3000
          REDIS_URL: redis://127.0.0.1:6379/0
          RATE_LIMIT_BACKEND: memory
          COOKIE_SECURE: "false"
          REGISTRATION_ENABLED: "true"
          METRICS_TOKEN: e2e-ci-metrics-placeholder
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      - name: Start frontend
        working-directory: apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: npm run dev -- --port 3000 &
      - name: Wait for API and frontend
        run: |
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/api/v1/health; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:3000; do sleep 3; done'
      - name: Run E2E tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
